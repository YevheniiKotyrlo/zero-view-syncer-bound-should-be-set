services:
  postgres:
    image: postgres:17-alpine
    command: ['postgres', '-c', 'wal_level=logical']
    environment:
      POSTGRES_USER: repro
      POSTGRES_PASSWORD: repro
      POSTGRES_DB: repro
    ports:
      - '5599:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repro -d repro']
      interval: 1s
      timeout: 3s
      retries: 30
