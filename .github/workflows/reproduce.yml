name: Reproduce

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Run the e2e matrix as tests
        # tests/repro.test.ts runs the four-leg matrix (stock / take-only /
        # zqlite-only / both) and asserts every per-bug expectation: all
        # three bugs visible on stock, each fixed by its own patch in
        # isolation, the non-NULL sanity window identical on every build.
        run: bun test --timeout 1500000

      - name: Upload leg artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leg-results
          path: |
            .tmp/result-*.json
            .tmp/zero-cache-*.log
